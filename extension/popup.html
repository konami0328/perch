<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perch</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup-body">

  <header class="popup-header">
    <span class="logo">🪶 Perch</span>
    <p class="tagline">co-study, no pressure</p>
  </header>

  <main class="popup-main">

    <!-- Create a new room -->
    <button id="btn-create" class="btn btn-primary">Create Room</button>

    <div class="divider"><span>or</span></div>

    <!-- Join an existing room -->
    <div class="join-form">
      <input
        id="input-code"
        class="code-input"
        type="text"
        maxlength="6"
        placeholder="ENTER CODE"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="btn-join" class="btn btn-secondary">Join</button>
    </div>

    <!-- Status / error message -->
    <p id="status-msg" class="status-msg" aria-live="polite"></p>

  </main>

</body>
<script src="popup.js"></script>
</html>
